[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "limen"
version = "0.1.0"
description = "Threshold-gated safety architecture for confidence-coupled embedded control: safety envelope, profile compiler, and eventized multi-rate scheduler"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
limen = "limen.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
